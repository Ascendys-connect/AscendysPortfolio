<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none" aria-label="ASCENDYS CONNECT">
  <!-- Icon: stylized diamond/chevron A shape -->
  <g>
    <!-- Outer diamond shape -->
    <polygon points="28,4 48,16 48,40 28,52 8,40 8,16" fill="#9800BF"/>
    <!-- Inner A shape -->
    <polygon points="28,14 40,36 16,36" fill="none" stroke="#FFC000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Cross bar -->
    <line x1="20" y1="30" x2="36" y2="30" stroke="#FFC000" stroke-width="2.5"/>
    <!-- Center dot -->
    <circle cx="28" cy="36" r="2" fill="#FFC000"/>
  </g>
  <!-- Text: ASCENDYS -->
  <text x="60" y="27" font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="2">ASCENDYS</text>
  <!-- Text: CONNECT -->
  <text x="60" y="44" font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-size="11" font-weight="400" fill="#ABABAB" letter-spacing="4">CONNECT</text>
</svg>
